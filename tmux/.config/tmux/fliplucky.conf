# vim:set ft=tmux:

# --> Fliplucky (dark)
# Copy of catppuccin's mocha palette, recoloured to match the Claude Code
# "fliplucky" theme (~/.claude/themes/fliplucky.json). Source this BEFORE
# catppuccin.tmux: the plugin sets its palette with `set -o`, so these win.
set -gq @thm_bg "#0b0b0c"
set -gq @thm_fg "#ffffff"

# Colors (orange #ff9500, blue #2f80ed, teal #30d5c8, red #e64a33)
set -gq @thm_rosewater "#ffb84d"
set -gq @thm_flamingo "#ffb84d"
set -gq @thm_pink "#ffb84d"
set -gq @thm_mauve "#ff9500"
set -gq @thm_red "#e64a33"
set -gq @thm_maroon "#e64a33"
set -gq @thm_peach "#ff9500"
set -gq @thm_yellow "#ff9500"
set -gq @thm_green "#30d5c8"
set -gq @thm_teal "#30d5c8"
set -gq @thm_sky "#6aa5f3"
set -gq @thm_sapphire "#2f80ed"
set -gq @thm_blue "#2f80ed"
set -gq @thm_lavender "#6aa5f3"

# Surfaces and overlays
set -gq @thm_subtext_1 "#b0b0b5"
set -gq @thm_subtext_0 "#c7c7cc"
set -gq @thm_overlay_2 "#b0b0b5"
set -gq @thm_overlay_1 "#8e8e93"
set -gq @thm_overlay_0 "#6e6e73"
set -gq @thm_surface_2 "#3a3a3f"
set -gq @thm_surface_1 "#2a2a2d"
set -gq @thm_surface_0 "#1a1a1e"
set -gq @thm_mantle "#111113"
set -gq @thm_crust "#0b0b0c"
